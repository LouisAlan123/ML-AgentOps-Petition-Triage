<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1160 720" font-family="Helvetica, Arial, sans-serif" font-size="13">
<defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0L10,5L0,10z" fill="#444"/></marker></defs>
<rect width="1160" height="720" fill="#fff"/>
<text x="20" y="30" font-size="18" font-weight="bold">Academic Petition Triage: architecture and deployment boundaries</text>
<text x="20" y="50" fill="#666">Dashed boxes = separate containers (deployment boundaries). Arrows = calls / messages. Everything runs under docker compose.</text>
<!-- client -->
<rect x="20" y="90" width="150" height="70" rx="8" fill="#eef" stroke="#447"/><text x="95" y="118" text-anchor="middle" font-weight="bold">Web client /</text><text x="95" y="136" text-anchor="middle">REST caller</text><text x="95" y="152" text-anchor="middle" fill="#666" font-size="11">submit, poll, feedback</text>
<!-- api -->
<rect x="220" y="70" width="220" height="200" rx="8" fill="#f5f9ff" stroke="#36c" stroke-dasharray="6,4"/>
<text x="330" y="92" text-anchor="middle" font-weight="bold">api (FastAPI)</text>
<text x="235" y="115">1 rate limit per client</text><text x="235" y="135">2 data contract validation</text><text x="235" y="155">   → reject = quarantine (422)</text><text x="235" y="175">3 input guardrail (injection,</text><text x="235" y="191">   toxicity) → block, no model</text><text x="235" y="211">4 idempotency + run cache</text><text x="235" y="231">5 enqueue → 202 + run_id</text><text x="235" y="255" fill="#666" font-size="11">GET /v1/runs/{id}, /trace, /metrics</text>
<!-- redis -->
<rect x="490" y="90" width="190" height="160" rx="8" fill="#fff4f4" stroke="#c33" stroke-dasharray="6,4"/>
<text x="585" y="112" text-anchor="middle" font-weight="bold">redis</text>
<rect x="505" y="122" width="160" height="26" fill="#fdd" stroke="#c66"/><text x="585" y="140" text-anchor="middle">stream:research</text>
<rect x="505" y="155" width="160" height="26" fill="#fdd" stroke="#c66"/><text x="585" y="173" text-anchor="middle">stream:adjudicate</text>
<text x="585" y="200" text-anchor="middle" font-size="11">run state · traces · quarantine</text><text x="585" y="216" text-anchor="middle" font-size="11">feedback · cache · rate counters</text><text x="585" y="236" text-anchor="middle" font-size="11" fill="#666">consumer groups = at-least-once</text>
<!-- researcher -->
<rect x="730" y="70" width="410" height="250" rx="8" fill="#f4fff4" stroke="#393" stroke-dasharray="6,4"/>
<text x="935" y="92" text-anchor="middle" font-weight="bold">researcher ×N (LangGraph agent 1), scales with --scale</text>
<rect x="745" y="105" width="80" height="30" rx="5" fill="#dfd" stroke="#393"/><text x="785" y="125" text-anchor="middle">classify</text>
<rect x="840" y="105" width="80" height="30" rx="5" fill="#dfd" stroke="#393"/><text x="880" y="125" text-anchor="middle">scope</text>
<rect x="935" y="105" width="80" height="30" rx="5" fill="#bfb" stroke="#393"/><text x="975" y="125" text-anchor="middle">plan</text>
<rect x="1035" y="105" width="80" height="30" rx="5" fill="#bfb" stroke="#393"/><text x="1075" y="125" text-anchor="middle">act</text>
<path d="M825 120H838M920 120H933M1015 113H1033" stroke="#444" marker-end="url(#a)"/><path d="M1035 128H1017" stroke="#444" marker-end="url(#a)"/>
<text x="1025" y="152" text-anchor="middle" font-size="11">loop ≤ 10 steps / 10 tools / 25 s</text>
<text x="745" y="178" font-weight="bold">Tools (agent chooses):</text>
<text x="745" y="197">search_corpus (semantic | keyword | hybrid)</text><text x="745" y="215">get_clause · find_citing_clauses (reverse refs)</text><text x="745" y="233">get_petition_fields · list_clauses_by_topic</text>
<rect x="745" y="248" width="380" height="58" rx="5" fill="#fff" stroke="#393"/><text x="935" y="268" text-anchor="middle" font-weight="bold">Retriever: LangChain FAISS + BM25 (RRF)</text><text x="935" y="286" text-anchor="middle" font-size="11">clause-level chunks · chapter-prefixed embeddings</text><text x="935" y="300" text-anchor="middle" font-size="11">reverse cross-reference index · query cache</text>
<!-- adjudicator -->
<rect x="730" y="350" width="410" height="170" rx="8" fill="#fffbe9" stroke="#b80" stroke-dasharray="6,4"/>
<text x="935" y="372" text-anchor="middle" font-weight="bold">adjudicator (LangGraph agent 2), no retrieval tools</text>
<rect x="745" y="385" width="72" height="30" rx="5" fill="#fe9" stroke="#b80"/><text x="781" y="405" text-anchor="middle">precheck</text>
<rect x="827" y="385" width="62" height="30" rx="5" fill="#fe9" stroke="#b80"/><text x="858" y="405" text-anchor="middle">draft</text>
<rect x="899" y="385" width="62" height="30" rx="5" fill="#fe9" stroke="#b80"/><text x="930" y="405" text-anchor="middle">guard</text>
<rect x="971" y="385" width="62" height="30" rx="5" fill="#fd6" stroke="#b80"/><text x="1002" y="405" text-anchor="middle">verify</text>
<rect x="1043" y="385" width="82" height="30" rx="5" fill="#fe9" stroke="#b80"/><text x="1084" y="405" text-anchor="middle">finalize</text>
<path d="M817 400H825M889 400H897M961 400H969M1033 400H1041" stroke="#444" marker-end="url(#a)"/>
<text x="745" y="440" font-size="12">precheck: out-of-corpus · conflicting provisions · degraded → escalate</text>
<text x="745" y="458" font-size="12">guard: blocks "hereby approved" / any unauthorised determination</text>
<text x="745" y="476" font-size="12">verify: citations ∈ retrieved, quotes verbatim, numbers grounded,</text>
<text x="745" y="494" font-size="12">        modifier ⇒ base cited. Fail → back to researcher (strategy=alt)</text>
<text x="745" y="512" font-size="12">        once, then escalate. Unverified answers are never returned.</text>
<!-- gateway -->
<rect x="470" y="380" width="210" height="130" rx="8" fill="#f6f0ff" stroke="#73b" stroke-dasharray="6,4"/>
<text x="575" y="402" text-anchor="middle" font-weight="bold">llm-gateway</text>
<text x="485" y="424" font-size="12">heuristic (offline stub, 400 ms)</text><text x="485" y="442" font-size="12">or openai_compat → free tier</text><text x="485" y="460" font-size="12">fault injection (/admin/fault)</text>
<text x="485" y="482" font-size="11" fill="#666">client side: timeout · retry+backoff</text><text x="485" y="497" font-size="11" fill="#666">· circuit breaker · token &amp; cost</text>
<!-- indexer -->
<rect x="220" y="330" width="210" height="110" rx="8" fill="#f4f4f4" stroke="#666" stroke-dasharray="6,4"/>
<text x="325" y="352" text-anchor="middle" font-weight="bold">indexer (one-shot job)</text>
<text x="235" y="374" font-size="12">PDF → parse → clause chunks</text><text x="235" y="392" font-size="12">→ embed only changed chunks</text><text x="235" y="410" font-size="12">→ FAISS + index_meta.json</text><text x="235" y="428" font-size="11" fill="#666">freshness, version, throughput</text>
<rect x="40" y="350" width="140" height="70" rx="6" fill="#fff" stroke="#666"/><text x="110" y="375" text-anchor="middle">corpus PDFs</text><text x="110" y="393" text-anchor="middle" font-size="11">Regulations +</text><text x="110" y="408" text-anchor="middle" font-size="11">Bye-Laws</text>
<!-- observability -->
<rect x="20" y="560" width="1120" height="140" rx="8" fill="#fafafa" stroke="#999" stroke-dasharray="6,4"/>
<text x="580" y="582" text-anchor="middle" font-weight="bold">Observability (separate containers)</text>
<rect x="45" y="598" width="230" height="80" rx="6" fill="#fff" stroke="#999"/><text x="160" y="622" text-anchor="middle" font-weight="bold">Prometheus</text><text x="160" y="642" text-anchor="middle" font-size="11">scrapes api, gateway, every</text><text x="160" y="657" text-anchor="middle" font-size="11">researcher/adjudicator replica</text>
<rect x="300" y="598" width="230" height="80" rx="6" fill="#fff" stroke="#999"/><text x="415" y="622" text-anchor="middle" font-weight="bold">Grafana</text><text x="415" y="642" text-anchor="middle" font-size="11">p50/p95, errors, throughput, per-</text><text x="415" y="657" text-anchor="middle" font-size="11">agent success, cost, quality</text>
<rect x="555" y="598" width="230" height="80" rx="6" fill="#fff" stroke="#999"/><text x="670" y="622" text-anchor="middle" font-weight="bold">Jaeger (OTLP)</text><text x="670" y="642" text-anchor="middle" font-size="11">one trace: api → researcher →</text><text x="670" y="657" text-anchor="middle" font-size="11">gateway → adjudicator</text>
<rect x="810" y="598" width="305" height="80" rx="6" fill="#fff" stroke="#999"/><text x="962" y="622" text-anchor="middle" font-weight="bold">cAdvisor + JSON logs</text><text x="962" y="642" text-anchor="middle" font-size="11">CPU / memory / uptime per container;</text><text x="962" y="657" text-anchor="middle" font-size="11">correlation_id = run_id on every log line</text>
<!-- arrows -->
<path d="M170 125H218" stroke="#444" stroke-width="1.5" marker-end="url(#a)"/>
<path d="M440 135H503" stroke="#444" stroke-width="1.5" marker-end="url(#a)"/><text x="447" y="128" font-size="11">XADD</text>
<path d="M665 135H743" stroke="#393" stroke-width="1.5" marker-end="url(#a)"/><text x="680" y="128" font-size="11">claim</text>
<path d="M730 300 C705 290, 700 230, 667 178" stroke="#393" stroke-width="1.5" fill="none" marker-end="url(#a)"/><text x="688" y="290" font-size="11" fill="#393">dossier</text><text x="688" y="303" font-size="11" fill="#393">hand-off</text>
<path d="M665 168 C700 200, 720 360, 760 384" stroke="#b80" stroke-width="1.5" fill="none" marker-end="url(#a)"/>
<path d="M1100 385 C1150 340, 1150 200, 1120 140" stroke="#b80" stroke-width="1.5" stroke-dasharray="4,3" fill="none" marker-end="url(#a)"/><text x="1145" y="260" font-size="11" fill="#b80" transform="rotate(90 1145 260)">verify failed: retry (alt)</text>
<path d="M745 290 L682 430" stroke="#73b" stroke-width="1.5" marker-end="url(#a)"/>
<path d="M827 415 L682 470" stroke="#73b" stroke-width="1.5" marker-end="url(#a)"/>
<path d="M180 385H218" stroke="#444" marker-end="url(#a)"/>
<path d="M430 400 C600 330, 700 320, 790 307" stroke="#666" stroke-dasharray="3,3" fill="none" marker-end="url(#a)"/><text x="560" y="345" font-size="11" fill="#666">index volume (read-only)</text>
<path d="M1084 520 V540 H705 V330 L640 252" stroke="#444" stroke-width="1.2" fill="none" marker-end="url(#a)"/><text x="860" y="536" font-size="11">result → run state; client polls api</text>
</svg>
