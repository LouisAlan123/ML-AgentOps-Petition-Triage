# docker compose up --build            -> whole system from a clean clone (reads .env.example, then .env if present)
# docker compose up --scale researcher=3
# docker compose --profile loadtest up locust     -> Locust UI on http://localhost:8089
#
# Deployment boundaries (see docs/architecture.md):
#  api          stateless HTTP edge: validation, quarantine, guardrails, cache, rate limit. Scales on request rate.
#  researcher   the expensive agent (most model calls + FAISS index in memory). The unit that scales (A7).
#  adjudicator  separate agent: draft/verify/route. Independent release + failure isolation from retrieval.
#  llm-gateway  the only egress to a model provider; provider swap is a config change, faults injectable.
#  indexer      one-shot batch job (D2); writes the index volume, then exits.
#  redis        queue (streams), run state, traces, cache, rate-limit counters.
x-app: &app
  build: .
  image: petition-triage:local
  env_file:
    - path: .env.example
    - path: .env
      required: false
  restart: unless-stopped
  volumes:
    - index_data:/data/index

x-after-index: &after-index
  redis: {condition: service_healthy}
  indexer: {condition: service_completed_successfully}
  llm-gateway: {condition: service_healthy}

services:
  redis:
    image: redis:7.2-alpine
    command: ["redis-server", "--appendonly", "yes"]
    volumes: [redis_data:/data]
    healthcheck: {test: ["CMD", "redis-cli", "ping"], interval: 5s, timeout: 3s, retries: 10}
    restart: unless-stopped

  indexer:
    <<: *app
    restart: "no"
    command: ["sh", "-c", "python -m app.corpus.synth && python -m app.corpus.pipeline index"]
    environment: {SERVICE_NAME: indexer}

  llm-gateway:
    <<: *app
    command: ["uvicorn", "app.gateway.main:app", "--host", "0.0.0.0", "--port", "8080"]
    environment: {SERVICE_NAME: llm-gateway}
    ports: ["8080:8080"]
    healthcheck: {test: ["CMD", "curl", "-sf", "http://localhost:8080/health"], interval: 5s, timeout: 3s, retries: 10}

  api:
    <<: *app
    command: ["uvicorn", "app.api.main:app", "--host", "0.0.0.0", "--port", "8000"]
    environment: {SERVICE_NAME: api}
    ports: ["8000:8000"]
    depends_on: *after-index
    healthcheck: {test: ["CMD", "curl", "-sf", "http://localhost:8000/ready"], interval: 5s, timeout: 3s, retries: 20}

  researcher:
    <<: *app
    command: ["python", "-m", "app.worker.main"]
    environment: {SERVICE_NAME: researcher, WORKER_ROLE: researcher, METRICS_PORT: "9100"}
    depends_on: *after-index
    healthcheck: {test: ["CMD", "curl", "-sf", "http://localhost:9100/metrics"], interval: 10s, timeout: 3s, retries: 10}

  adjudicator:
    <<: *app
    command: ["python", "-m", "app.worker.main"]
    environment: {SERVICE_NAME: adjudicator, WORKER_ROLE: adjudicator, METRICS_PORT: "9100"}
    depends_on: *after-index
    healthcheck: {test: ["CMD", "curl", "-sf", "http://localhost:9100/metrics"], interval: 10s, timeout: 3s, retries: 10}

  jaeger:
    image: jaegertracing/all-in-one:1.57
    environment: {COLLECTOR_OTLP_ENABLED: "true"}
    ports: ["16686:16686"]
    restart: unless-stopped

  prometheus:
    image: prom/prometheus:v2.53.0
    volumes: ["./observability/prometheus.yml:/etc/prometheus/prometheus.yml:ro"]
    ports: ["9090:9090"]
    restart: unless-stopped

  cadvisor:
    image: gcr.io/cadvisor/cadvisor:v0.49.1
    privileged: true
    volumes: ["/:/rootfs:ro", "/var/run:/var/run:ro", "/sys:/sys:ro", "/var/lib/docker/:/var/lib/docker:ro"]
    restart: unless-stopped

  grafana:
    image: grafana/grafana:11.1.0
    env_file:
      - path: .env.example
      - path: .env
        required: false
    environment: {GF_AUTH_ANONYMOUS_ENABLED: "true", GF_AUTH_ANONYMOUS_ORG_ROLE: Viewer}
    volumes:
      - ./observability/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./observability/grafana/dashboards:/var/lib/grafana/dashboards:ro
    ports: ["3000:3000"]
    depends_on: [prometheus]
    restart: unless-stopped

  locust:
    <<: *app
    profiles: ["loadtest"]
    restart: "no"
    command: ["locust", "-f", "loadtest/locustfile.py", "--host", "http://api:8000"]
    ports: ["8089:8089"]
    depends_on: [api]

volumes:
  index_data:
  redis_data:
