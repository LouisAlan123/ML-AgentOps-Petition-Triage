global: {scrape_interval: 5s, evaluation_interval: 5s}
scrape_configs:
  - job_name: api
    static_configs: [{targets: ["api:8000"]}]
  - job_name: llm-gateway
    static_configs: [{targets: ["llm-gateway:8080"]}]
  # DNS service discovery returns every replica, so --scale researcher=3 is scraped automatically
  - job_name: researcher
    dns_sd_configs: [{names: ["researcher"], type: A, port: 9100}]
  - job_name: adjudicator
    dns_sd_configs: [{names: ["adjudicator"], type: A, port: 9100}]
  - job_name: cadvisor
    static_configs: [{targets: ["cadvisor:8080"]}]
  - job_name: prometheus
    static_configs: [{targets: ["localhost:9090"]}]
